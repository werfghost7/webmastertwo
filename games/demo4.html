<!DOCTYPE html>
<html>

<head>
	<title>반응속도 테스트</title>
	<style>
		body { text-align:center; font-family:sans-serif; }
		#box { width:300px; height:200px; margin:30px auto; background:#ccc;
		display:flex; align-items:center; justify-content:center;
		font-size:22px; color:white; border-radius:12px; cursor:pointer; }
	</style>
</head>
<body>
	<h1>반응속도 테스트</h1>
	<p>초록색으로 바뀌는 순간 클릭하세요!</p>
	<div id="box">시작하려면 클릭</div>
	<script>
		let state = "ready", startTime;
		const box = document.getElementById("box");
		box.onclick = function() {
			if (state === "ready") {
				state = "waiting"; box.innerText = "기다리세요...";
				box.style.background = "#888";
				const delay = Math.random() * 3000 + 1000;
				setTimeout(() => {
					state = "go"; box.innerText = "지금 클릭!";
					box.style.background = "#3FBF5F";
					startTime = Date.now();
				}, delay);
			} else if (state === "go") {
				let reaction = Date.now() - startTime;
				reaction = reaction * 0.001;
				box.innerText = reaction + "초! 다시 클릭";
				box.style.background = "#ccc"; state = "ready";
			} else {
				box.innerText = "너무 빨랐어요! 다시 클릭";
				state = "ready"; box.style.background = "#ccc";
			}
		};
	</script>
</body>

</html>
